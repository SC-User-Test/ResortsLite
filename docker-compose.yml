version: "3.8"

services:
  resortsLite:
    image: resortsLite:latest
    container_name: resortsLite-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # JVM settings
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker
      # Application port
      SERVER_PORT: "8080"
      # JWT secret (override with a strong secret in production)
      JWT_SECRET: "change-me-in-production-32chars!!"
      # External service URLs (resolved via ECS Service Connect in production)
      PAYMENT_SERVICE_URL: "http://payment-service:9090/payments/charge"
      INVENTORY_SERVICE_URL: "http://inventory-service:8081/rooms/available"
      # Memcached endpoint (Amazon ElastiCache in production)
      MEMCACHED_ENDPOINT: "localhost:11211"
      # EFS report base path
      REPORT_BASE_PATH: "/mnt/efs/reports/"
      # Timezone
      TZ: UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  app-network:
    driver: bridge
