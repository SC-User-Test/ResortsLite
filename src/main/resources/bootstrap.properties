# bootstrap.properties — loaded before application.properties by Spring Cloud
# Required to activate the GCP Secret Manager property source so that
# sm:// references in application.properties are resolved at startup.
#
# Set the GCP project ID via the GCP_PROJECT_ID environment variable
# (injected by GKE Workload Identity, Cloud Run, or a Kubernetes Secret).
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}

# Enable the Secret Manager bootstrap property source
spring.cloud.gcp.secretmanager.enabled=true
