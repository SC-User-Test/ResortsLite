# ResortsLite - Cloud-Ready Configuration for Azure
# All sensitive values and environment-specific settings are externalized

spring.application.name=ResortsLite

# Server port - externalized for dynamic assignment by Azure Container Apps / AKS
# Can be overridden by environment variable SERVER_PORT
server.port=${SERVER_PORT:8080}

# Database configuration - credentials externalized to Azure Key Vault
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Azure Cache for Redis configuration for distributed session and caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=2000ms

# Spring Session configuration - use Redis for distributed session management
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m

# Azure Key Vault configuration
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://your-keyvault.vault.azure.net/}
azure.keyvault.enabled=true

# Azure Active Directory configuration for authentication
azure.activedirectory.enabled=${AZURE_AD_ENABLED:false}
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_AD_CLIENT_SECRET:}

# Azure Blob Storage configuration
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:backups}

# Azure Service Bus configuration for scheduled tasks
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE:scheduled-reports}

# Application endpoints - externalized to Azure App Configuration
# All URLs use HTTPS for cloud security compliance
app.payment.endpoint=${PAYMENT_SERVICE_URL:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal:7070/send}
app.report.download.url=${REPORT_DOWNLOAD_URL:https://reports.resorts-internal.com/download/}

# Cache configuration
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:60}

# Logging configuration for cloud environments
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator endpoints for health checks (required for Azure Container Apps / AKS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
