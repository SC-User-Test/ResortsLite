# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Port is now resolved from the PORT environment variable at runtime.
# GCP Cloud Run automatically injects PORT (typically 8080). GKE and other orchestrators
# can override this via environment variable. Falls back to 8080 for local development.
# Replaces: server.port=8080  (hard-coded — cr-java-0077)
server.port=${PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# ---------------------------------------------------------------------------
# cr-java-0071: Hard-coded Environment URLs — remediated
# ---------------------------------------------------------------------------
# All environment-specific service URLs are now externalised here and resolved
# at runtime from environment variables. Sensitive endpoints (e.g. internal
# service URLs that must not be committed) can alternatively be stored in
# GCP Secret Manager and referenced with the sm:// prefix.
#
# Override at runtime via environment variables:
#   APP_INVENTORY_ENDPOINT          — inventory service base URL
#   APP_REPORT_DOWNLOAD_BASE_URL    — report download service base URL
# ---------------------------------------------------------------------------
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:http://inventory-service.internal:8081/rooms/available}
app.report.download.base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# GCS configuration — replaces hard-coded absolute file paths (cr-java-0061)
# Override these via environment variables: GCS_BUCKET_NAME, GCS_REPORT_PREFIX, GCS_BACKUP_PREFIX
gcs.bucket.name=${GCS_BUCKET_NAME:resorts-lite-reports}
gcs.report.prefix=${GCS_REPORT_PREFIX:reports/}
gcs.backup.prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# ---------------------------------------------------------------------------
# cr-java-0069: Hard-coded Database Credentials — remediated
# ---------------------------------------------------------------------------
# DB credentials are now resolved at runtime from Google Secret Manager via
# the Spring Cloud GCP Secret Manager property source (sm:// prefix).
# The secrets must be created in GCP Secret Manager before deployment:
#   gcloud secrets create resorts-lite-db-username --replication-policy="automatic"
#   echo -n "admin" | gcloud secrets versions add resorts-lite-db-username --data-file=-
#   gcloud secrets create resorts-lite-db-password --replication-policy="automatic"
#   echo -n "Resort\$Pass#2019!" | gcloud secrets versions add resorts-lite-db-password --data-file=-
#
# The GCP_PROJECT_ID environment variable (or spring.cloud.gcp.project-id) must be
# set to the target GCP project so the Secret Manager client can resolve the secrets.
# ---------------------------------------------------------------------------
app.db.username=${sm://resorts-lite-db-username}
app.db.password=${sm://resorts-lite-db-password}
# ---------------------------------------------------------------------------
# cr-java-0090 FIX: File-based Authentication → GCP Secret Manager + Cloud IAM
# ---------------------------------------------------------------------------
# The DB host was previously a hard-coded static constant in BookingService.java
# (effectively "file-based" credential storage in source code).  It is now
# resolved at runtime from GCP Secret Manager via the sm:// property source.
# The workload's GCP service account must hold roles/secretmanager.secretAccessor
# on this secret — Cloud IAM enforces service-to-service authentication without
# any local credential files.
#
# Create the secret before deployment:
#   echo -n "db-prod.resorts-internal.com" | \
#     gcloud secrets versions add resorts-lite-db-host --data-file=-
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: HTTP Session State → Google Cloud Memorystore for Redis
# ---------------------------------------------------------------------------
# Spring Session is configured to use Redis as the distributed session store.
# All HttpSession state has been replaced with RedisTemplate-based storage so
# that every application instance shares the same session data, enabling
# stateless horizontal scaling without sticky-session routing.
#
# Set the following environment variables before deployment:
#   REDIS_HOST  — Memorystore for Redis instance IP (from GCP Console)
#   REDIS_PORT  — Redis port (default 6379)
#
# GCP Memorystore provisioning (one-time):
#   gcloud redis instances create resorts-lite-sessions \
#     --size=1 --region=us-central1 --redis-version=redis_7_0
#   gcloud redis instances describe resorts-lite-sessions \
#     --region=us-central1 --format="get(host)"   # → set as REDIS_HOST
# ---------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resorts-lite:session
app.session.ttl-seconds=${SESSION_TTL_SECONDS:1800}

# ---------------------------------------------------------------------------
# cr-java-0067 FIX: In-Memory Caching Without TTL → Google Cloud Memorystore for Redis
# ---------------------------------------------------------------------------
# The static in-memory bookingCache (HashMap without TTL) has been replaced with
# Google Cloud Memorystore for Redis via RedisTemplate with a configurable TTL.
# This prevents unbounded memory growth, out-of-memory errors, and stale data
# inconsistencies across multiple application instances.
#
# Override at runtime via environment variable:
#   BOOKING_CACHE_TTL_SECONDS — booking cache entry TTL in seconds (default 300 s / 5 min)
# ---------------------------------------------------------------------------
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:300}
