# ResortsLite - Cloud-Ready Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0065 FIX: Spring Session backed by Google Cloud Memorystore for Redis.
# Setting store-type=redis causes Spring Session to transparently store all session
# data in the centralised Redis instance instead of in-process JVM memory.
# This makes every application instance fully stateless and supports horizontal
# scaling, rolling deployments, and auto-scaling on GCP without session affinity.
#
# Provision a Memorystore for Redis instance and supply the connection details:
#   gcloud redis instances create resorts-session-store \
#       --size=1 --region=us-central1 --redis-version=redis_7_0
# Then set the following environment variables in Cloud Run / GKE:
#   REDIS_HOST  — the Memorystore instance IP (from `gcloud redis instances describe`)
#   REDIS_PORT  — typically 6379
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# GCS configuration — values should be overridden via environment variables in GCP
# (e.g. GCS_BUCKET_NAME, GCS_REPORTS_PREFIX, GCS_BACKUP_PREFIX)
gcs.bucket.name=${GCS_BUCKET_NAME:resorts-reports-bucket}
gcs.reports.prefix=${GCS_REPORTS_PREFIX:reports/}
gcs.backup.prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment-variable-driven binding.
# GCP Cloud Run injects PORT automatically; GKE / Cloud Run jobs can override SERVER_PORT.
# The fallback value (8080) is used only for local development when no env var is set.
# Set SERVER_PORT in your Cloud Run service configuration or GKE Deployment env section.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
# cr-java-0069 FIX: DB credentials are now resolved at runtime from Google Secret Manager.
# The sm:// prefix is handled by Spring Cloud GCP Secret Manager bootstrap auto-configuration.
# Secrets must be created in GCP Secret Manager before deployment:
#   gcloud secrets create db-username --replication-policy="automatic"
#   echo -n "sa" | gcloud secrets versions add db-username --data-file=-
#   gcloud secrets create db-password --replication-policy="automatic"
#   echo -n "" | gcloud secrets versions add db-password --data-file=-
# The GCP project is resolved from the environment (GOOGLE_CLOUD_PROJECT or ADC).
spring.datasource.username=${sm://db-username}
spring.datasource.password=${sm://db-password}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Hard-coded environment-specific URLs replaced with externalized configuration.
# Override these via environment variables (INVENTORY_SERVICE_URL, REPORT_DOWNLOAD_BASE_URL)
# in GCP Cloud Run / GKE, or store sensitive endpoints in GCP Secret Manager and reference
# them as sm:// placeholders (requires spring-cloud-gcp-starter-secretmanager on the classpath).
#
# Example GCP Secret Manager setup for sensitive endpoints:
#   gcloud secrets create inventory-service-url --replication-policy="automatic"
#   echo -n "https://inventory-service.internal:8081/rooms/available" | gcloud secrets versions add inventory-service-url --data-file=-
#   gcloud secrets create report-download-base-url --replication-policy="automatic"
#   echo -n "https://reports.resorts-internal.com/download" | gcloud secrets versions add report-download-base-url --data-file=-
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# cr-java-0067 FIX: Booking cache TTL for Google Cloud Memorystore for Redis.
# Replaces the former unbounded static HashMap (bookingCache) in BookingController.
# Every cache entry written via RedisTemplate.opsForValue().set(...) will automatically
# expire after this many minutes, preventing stale data and memory exhaustion.
# Override via the BOOKING_CACHE_TTL_MINUTES environment variable in Cloud Run / GKE,
# or set this property directly in a GCP Secret Manager-backed config source.
#
# Example Cloud Run override:
#   gcloud run services update resorts-lite \
#       --update-env-vars BOOKING_CACHE_TTL_MINUTES=60
app.booking.cache.ttl.minutes=${BOOKING_CACHE_TTL_MINUTES:30}
