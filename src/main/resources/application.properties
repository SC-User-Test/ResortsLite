# ResortsLite - Cloud-Ready Configuration for AWS
spring.application.name=ResortsLite

# FIXED cr-java-0077: Server port now uses environment variable for dynamic assignment by ECS/EKS
# Container orchestration platforms can override this via environment variables
server.port=${SERVER_PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Database credentials are now loaded from AWS Secrets Manager
# These are fallback values for local development only
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# AWS Configuration
# FIXED cr-java-0071: Service endpoints externalized to AWS Systems Manager Parameter Store
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secret-name=${AWS_SECRET_NAME:resortslite/db/credentials}
aws.s3.bucket-name=${S3_BUCKET_NAME:resortslite-reports}

# Service Endpoints - Externalized Configuration
# FIXED cr-java-0071: All hardcoded URLs replaced with environment variables
# These can be configured via AWS Parameter Store or environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-service:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-service:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify-service:7070/send}
app.reports.base-url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# Redis Configuration for Distributed Session Management
# FIXED cr-java-0065: Spring Session with Redis for stateless application instances
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Spring Session Configuration
# FIXED cr-java-0065, cr-java-0067: Enable Redis-backed session storage
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m

# Cache Configuration
# FIXED cr-java-0067: Redis cache with TTL for distributed caching
spring.cache.type=redis
spring.cache.redis.time-to-live=60m
spring.cache.redis.cache-null-values=false

# Logging Configuration - Structured logging for cloud monitoring
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
